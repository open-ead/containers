version: '3'

vars:
  IMAGE: ghcr.io/open-ead/ubuntu-builder

tasks:
  build:
    - docker build -t {{.IMAGE}} .
  publish:
    vars:
      TAG_COMMIT:
        sh: echo "sha-$(git rev-parse --short=7 HEAD)"
    cmds:
      - docker tag {{.IMAGE}}:latest {{.IMAGE}}:{{.TAG_COMMIT}}
      - docker push {{.IMAGE}}:latest
      - docker push {{.IMAGE}}:{{.TAG_COMMIT}}
      - cmd: echo 'https://github.com/orgs/open-ead/packages/container/package/ubuntu-builder'
        silent: true


